<!doctype html>
<html lang="tr">
<head>

<title>Hacıbayram Menü Fotoğrafları</title>

<style>
body{margin:0}[hidden]{display:none!important}

:root{--bg:#f7f4f0;--fg:#2a1a14;--muted:#6e5a50;--line:#e4d8ce;--card:#fffdfb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17110e;--fg:#f3e9e1;--muted:#b8a497;--line:#3a2c25;--card:#201814;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110e;--fg:#f3e9e1;--muted:#b8a497;--line:#3a2c25;--card:#201814;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:Georgia,serif}
main{max-width:1000px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:32px;margin:0 0 4px;font-weight:400}
h2{font-size:22px;font-weight:400;margin:36px 0 14px}
p{color:var(--muted);margin:0;font-family:system-ui,sans-serif;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
figure img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff}
figcaption{padding:10px 12px;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
figcaption span{color:var(--muted);font-weight:400;font-size:12px}
</style>
</head>
